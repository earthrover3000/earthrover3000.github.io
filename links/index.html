<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Links</title>
<style>
  :root { font-family: system-ui, sans-serif; line-height: 1.4; }
  body { max-width: 34rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .note { color: GrayText; font-size: .85rem; margin: 0 0 1.5rem; }
  ul { list-style: none; margin: 0; padding: 0;
        border: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
        border-radius: 12px; overflow: hidden; }
  li + li { border-top: 1px solid
             color-mix(in srgb, CanvasText 12%, transparent); }
  a { display: flex; gap: .75rem; align-items: center; padding: .9rem 1rem;
       color: inherit; text-decoration: none; }
  a:active { background: color-mix(in srgb, CanvasText 8%, transparent); }
  .glyph { font-size: 1.4rem; width: 1.6rem; text-align: center; }
</style>
</head>
<body>
<h1>Links</h1>
<p class="note">Open one, then Add to Home Screen.</p>
<ul><li><a href="https://earthrover3000.github.io/lifespan-atlas/public/app/"><span class="glyph">🕛</span><span>Life Dial</span></a></li><li><a href="https://earthrover3000.github.io/lifespan-atlas/protected/app/"><span class="glyph">🧭</span><span>Lifespan Atlas</span></a></li><li><a href="https://earthrover3000.github.io/orb/protected/app/"><span class="glyph">🔘</span><span>Orb</span></a></li></ul>
</body>
</html>
